plugins {
    id 'com.android.application'
}

android {
    namespace 'com.korotetris.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.korotetris.game'
        minSdk 35          // Android 15 en adelante
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la clave de depuración para poder instalarlo directamente
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
